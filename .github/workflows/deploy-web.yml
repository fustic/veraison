# Builds the web app and deploys it to Firebase Hosting on every push to main.
# Signs in to Google Cloud with Workload Identity Federation (no service account key),
# so it works under the org policy that blocks key creation. One-time setup: README, "Web".
# The provider and service account names are not secret; only pushes to main of
# fustic/veraison can use them.
name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
      - run: npm run content:check

  deploy:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx expo export -p web
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/463285819168/locations/global/workloadIdentityPools/github/providers/veraison
          service_account: github-deploy@veraison-353ad.iam.gserviceaccount.com
      - run: npx --yes firebase-tools deploy --only hosting --non-interactive
